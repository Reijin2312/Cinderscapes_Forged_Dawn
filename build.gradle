plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

group = project.maven_group
version = project.mod_version
base.archivesName = project.archives_base_name

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDirs = ['common/src/main/java', 'client/src/main/java', 'worldgen/src/main/java']
            exclude '**/data/**'
            exclude '**/integration/CinderscapesModMenu.java'
            exclude '**/biome/CinderscapesBiomeRemappings.java'
            exclude '**/biomegen/CinderscapesBiomeAPIGeneration.java'
            exclude '**/init/CinderscapesArmorTrimItemModels.java'
            exclude '**/init/CinderscapesBlockFamilies.java'
            exclude '**/item/CinderscapesItemGroups.java'
            exclude '**/item/ItemGroupEntries.java'
            exclude '**/CinderscapesWorldgen.java'
        }
        resources {
            srcDirs = ['common/src/main/resources', 'client/src/main/resources', 'worldgen/src/main/resources',
                       'common/src/main/generated']
            exclude 'fabric.mod.json'
            exclude 'cinderscapes.accesswidener'
        }
    }
    gametest {
        java.srcDir 'src/gametest/java'
        resources.srcDir 'src/gametest/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = project.neoforge_version
    accessTransformers = files('common/src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client { client() }
        server { server() }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'cinderscapes'
        }
    }
    mods {
        cinderscapes {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.neoforged.net/releases' }
    maven { url 'https://maven.terraformersmc.com/releases' }
    maven { url 'https://maven.terraformersmc.com' }
    maven { url 'https://maven.gnomecraft.net/releases' }
    maven { url 'https://maven.shedaniel.me' }
}

dependencies {
    implementation "com.terraformersmc:biolith-neoforge:${biolith_version}"
    jarJar("com.terraformersmc:biolith-neoforge:${biolith_version}") { transitive = false }
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${clothconfig_version}"
    compileOnly files(
            "libs/terraform-shapes-api-v1-${terraform_shapes_api_version}-mojmap.jar"
    )
}

def syncTerraformRuntime = tasks.register('syncTerraformRuntime', Sync) {
    from({ files(
            "libs/terraform-shapes-api-v1-${terraform_shapes_api_version}-mojmap.jar"
    ).collect { zipTree(it) } })
    include 'com/terraformersmc/terraform/**/*.class'
    exclude 'com/terraformersmc/terraform/shapes/api/Position*.class'
    exclude 'com/terraformersmc/terraform/shapes/impl/validator/AirValidator*.class'
    exclude 'com/terraformersmc/terraform/shapes/impl/validator/SafelistValidator*.class'
    exclude 'com/terraformersmc/terraform/shapes/impl/filler/SimpleFiller*.class'
    exclude 'com/terraformersmc/terraform/shapes/impl/filler/RandomSimpleFiller*.class'
    into layout.buildDirectory.dir('generated/terraformClasses')
}

sourceSets.main.output.dir(layout.buildDirectory.dir('generated/terraformClasses'), builtBy: syncTerraformRuntime)

tasks.named('compileJava') {
    finalizedBy syncTerraformRuntime
}

tasks.named('compileGametestJava') {
    dependsOn syncTerraformRuntime
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

jar {
    from('LICENSE') { rename { "${it}_${project.name}" } }
}

tasks.named('runGameTestServer') {
    dependsOn tasks.named('gametestClasses'), syncTerraformRuntime
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn syncTerraformRuntime
}
