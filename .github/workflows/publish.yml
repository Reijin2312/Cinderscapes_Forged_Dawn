name: Publish Cinderscapes

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: Release channel
        required: true
        default: release
        type: choice
        options: [release, beta, alpha]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build release JAR
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/cinderscapes-neoforge-5.0.4-neoforge.2.jar
          name: Cinderscapes NeoForge 5.0.4-neoforge.2
          version: 5.0.4-neoforge.2
          version-type: ${{ inputs.version_type }}
          changelog-file: CHANGELOG.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            cloth-config(required)
          retry-attempts: 2
          retry-delay: 10000
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinderscapes-neoforge-1.21.1
          path: build/libs/cinderscapes-neoforge-5.0.4-neoforge.2.jar

